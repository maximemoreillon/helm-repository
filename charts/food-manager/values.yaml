nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: moreillon/food-manager
  tag: ""
  pullPolicy: IfNotPresent

# Port the app listens on inside the container (passed as PORT).
# Must be >1024 since the container runs as a non-root user.
containerPort: 3000

service:
  type: NodePort
  nodePort: 31081

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

securityContext:
  runAsNonRoot: true
  # "node" user built into the node:alpine base image
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env: []
envFrom: []

mongodb:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
  persistence:
    size: 100Gi
  auth:
    enabled: false
