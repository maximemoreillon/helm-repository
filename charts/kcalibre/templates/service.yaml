apiVersion: v1
kind: Service
metadata:
  name: {{ include "kcalibre.fullname" . }}
  labels:
    {{- include "kcalibre.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kcalibre.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
